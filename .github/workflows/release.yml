name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mobius ${{ github.ref_name }}"
          releaseBody: |
            Mobius — an automatic download organizer for macOS, Windows, and Linux.
            Release notes are generated from the README version history.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notes:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release notes from README version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          awk -v tag="$VERSION" '
            found && $0 ~ /^## / { exit }
            found && $0 ~ /^### v/ { exit }
            $0 ~ ("^### v" tag "$") { found=1; next }
            found { print }
          ' README.md > section.md

          {
            echo "Mobius — an automatic download organizer for macOS, Windows, and Linux."
            echo
            echo "## ${TAG}"
            echo
            if [ -s section.md ]; then
              cat section.md
            else
              echo "See the README for details."
            fi
            echo
            echo "---"
            echo
            echo "Builds: macOS (Apple Silicon), Windows (x64), and Linux (x64, \`.deb\` + AppImage)."
            echo
            echo "Full details and version history: https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md"
          } > release_notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release_notes.md
