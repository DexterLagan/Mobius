[package]
name = "mobius"
version = "0.1.0"
description = "Automatic download organizer"
authors = ["Dexter Santucci"]
license = "MIT"
repository = "https://github.com/DexterLagan/Mobius"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mobius_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
